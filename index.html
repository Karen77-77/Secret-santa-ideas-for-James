.pop{animation:pp 1.4s ease-in-out infinite}

.steam{position:absolute;top:10px;left:50%;z-index:1;display:flex;gap:14px;transform:translateX(-50%)}
.steam b{width:8px;height:40px;border-radius:8px;background:linear-gradient(#fff,transparent);animation:st 2s infinite;opacity:0}

.dots{display:flex;gap:7px}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.dots span.on{background:var(--gold);transform:scale(1.5)}
.hint{font-size:.85rem;opacity:.75;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{opacity:.25}}
button{font:inherit;font-weight:700;color:#4a0a1c;background:var(--gold);border:0;border-radius:30px;padding:12px 26px;margin-top:14px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
.orb,.steam{display:none}
.big{animation:bob 5s ease-in-out infinite!important;width:200px;height:200px;font-size:0}
.big svg{width:200px;height:200px;display:block}

#stage{overflow-y:auto}.slide{margin:auto 0}
@media (max-height:720px){.hero,.big,.big svg{width:150px;height:150px}p{font-size:1rem;margin:5px 0}h2{font-size:2rem}}
</style>
</head>
